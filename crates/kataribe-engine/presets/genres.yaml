# ジャンルプリセット。
# guidance はプロンプトにそのまま入る。ローカル LLM でも守れるよう、短く具体的に書く。

genres:
  - id: literary
    label: 純文学
    description: 人間の内面や関係の機微を、文章そのものの力で描く。
    guidance: |
      - 筋の面白さより、人物の内面の揺れと、その場の空気を丁寧に描く。
      - 感情を説明せず、仕草・情景・沈黙・ものの手触りで伝える。
      - 安易な結論や教訓で締めない。余韻と曖昧さを残してよい。
      - 紋切り型の比喩を避け、その人物にしか見えない細部を選ぶ。

  - id: sf
    label: SF
    description: 科学的・技術的な仮説が、人と社会をどう変えるかを描く。
    guidance: |
      - 中心となる仮説（技術・現象・社会制度）を一つに絞り、その帰結を一貫して描く。
      - 設定の説明は会話や行動の中に溶かし、講義のような説明を長く続けない。
      - 世界のルールを途中で都合よく変えない。
      - 未知のものに触れたときの驚き（センス・オブ・ワンダー）を大切にする。

  - id: mystery
    label: ミステリ
    description: 謎の提示から論理的な解決までを、手がかりを示しながら描く。
    guidance: |
      - 読者にもフェアであること。解決に必要な手がかりは、解決より前の場面にさりげなく書いておく。
      - 探偵役は推理で真相に至る。偶然や超自然的な力で解決しない。
      - 容疑者それぞれに動機と機会を持たせ、読者の疑いを分散させる。
      - まだ明かしていない真相を、地の文や心の声で先に漏らさない。

  - id: fantasy
    label: ファンタジー
    description: 魔法や異世界など、現実と異なる理（ことわり）の世界での冒険や葛藤を描く。
    guidance: |
      - 魔法や世界の仕組みには代償や制約を設け、それを物語の緊張に使う。
      - 固有名詞を一度に出しすぎない。読者が覚えられる速さで世界を広げる。
      - 風景・食べ物・習慣など、五感に訴える細部で世界の実在感を出す。

  - id: light_novel
    label: ライトノベル
    description: 個性的な登場人物と軽快な掛け合いで、テンポよく読ませる。
    guidance: |
      - キャラクターの個性を口調・反応・こだわりではっきり立てる。
      - 会話のテンポを重視し、地の文は短めに。場面転換を早く。
      - 一人称の語り手のツッコミや内心の声でユーモアを出してよい。
      - 各場面に小さな山場や引きを作り、次を読みたくさせる。

  - id: romance
    label: 恋愛
    description: 二人の距離が縮まり、すれ違い、結ばれるまでの心の動きを描く。
    guidance: |
      - 気持ちの変化を段階的に描く。急に好きにならせない。
      - 相手のささいな言動に心が動く瞬間を、具体的な仕草や言葉で描く。
      - すれ違いには、二人それぞれにもっともな理由を持たせる。

  - id: horror
    label: ホラー
    description: 日常に忍び込む違和感から、逃れられない恐怖へと追い詰める。
    guidance: |
      - 恐怖の正体をすぐに見せない。違和感を少しずつ積み重ねる。
      - 音・匂い・温度など、視覚以外の感覚で不穏さを出す。
      - 登場人物の合理的な行動が、かえって状況を悪くする構図を使う。

  - id: historical
    label: 歴史・時代
    description: 実在の時代を舞台に、その時代を生きる人々を描く。
    guidance: |
      - 時代にない言葉・概念・道具を出さない（和製英語やカタカナ語に注意）。
      - 身分・慣習・言葉遣いを時代に合わせる。
      - 史実と創作の境目では、史実を歪めすぎない。

  - id: bishoujo
    label: 美少女ノベル
    description: 魅力的なヒロインたちと主人公の交流を、ヒロインの可愛らしさを軸に描く。
    guidance: |
      - ヒロインごとに、外見・口調・価値観・主人公への態度をはっきり描き分ける。
      - 主人公の視点から見たヒロインの表情・仕草・声の変化を丁寧に描写する。
      - 日常のやり取りの積み重ねで関係を深め、ここぞという場面で感情を大きく動かす。

  - id: bl
    label: BL
    description: 男性同士の関係と感情の機微を描く。
    guidance: |
      - 二人の関係性（立場・力関係・過去）を軸に、感情の揺れを丁寧に描く。
      - 触れる・目を逸らすなどの小さな身体的な距離の変化で緊張感を出す。
      - 二人それぞれの視点・葛藤に説得力を持たせ、一方を都合のよい存在にしない。

  - id: erotic
    label: 官能
    description: 性愛と官能を主題に、心と身体の結びつきを描く。
    guidance: |
      - 官能は身体だけでなく、期待・ためらい・羞恥・高揚といった心の動きと一緒に描く。
      - 五感（肌の温度、息づかい、匂い、声）を具体的に描写し、同じ表現を繰り返さない。
      - 場面の前後の感情の流れを大切にし、性的な場面を物語から浮かせない。

  - id: general
    label: その他
    description: 特定のジャンルに寄せず、企画に書かれた方向性に従う。
    guidance: |
      - 企画に書かれた読みどころとトーンを最優先する。

ratings:
  general: |
    全年齢向け。性的な描写はしない（恋愛感情や軽い接触までに留める）。残酷な描写は抑える。
    未成年を性的に描写しない。
  r15: |
    15 歳以上向け。暴力や死の描写は必要に応じて書いてよい。性的な場面はほのめかしに留め、直接的に描写しない。
    未成年を性的に描写しない。
  r18: |
    成人向け。物語上必要であれば、性的な描写や暴力的な描写を直接的に書いてよい。
    性的な場面に登場する人物は全員 18 歳以上の成人とし、未成年を性的に描写しない。
