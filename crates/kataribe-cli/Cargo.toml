[package]
name = "kataribe-cli"
description = "kataribe のヘッドレス実行用コマンドライン"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "kataribe_cli"
path = "src/lib.rs"

[[bin]]
name = "kataribe-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
kataribe-engine.workspace = true
kataribe-llm.workspace = true
kataribe-project.workspace = true
kataribe-text.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
kataribe-llm = { workspace = true, features = ["testing"] }
serde_json.workspace = true
wiremock.workspace = true

[lints]
workspace = true
