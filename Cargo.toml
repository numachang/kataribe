[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/numachang/kataribe"

[workspace.dependencies]
kataribe-text = { path = "crates/kataribe-text" }
kataribe-llm = { path = "crates/kataribe-llm" }
kataribe-project = { path = "crates/kataribe-project" }
kataribe-engine = { path = "crates/kataribe-engine" }
kataribe-cli = { path = "crates/kataribe-cli" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
jiff = { version = "0.2", features = ["serde"] }
keyring = "4.2"
minijinja = { version = "2.24", features = ["loader"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
unicode-segmentation = "1.13"

# テスト用
insta = "1.48"
pretty_assertions = "1.4"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# pedantic のうち、この規模のコードでは読みやすさを損ねるものは外す
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
