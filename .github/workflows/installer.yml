name: インストーラ

# LTO 付きのリリースビルドで最も重いので、main へのプッシュのたびには作らない。
# 必要なときに手動で実行するか、v で始まるタグを付けたときに作る
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# トークンは読むだけにする。外部のアクションは、タグを付け替えられても中身が変わらないよう
# コミットの SHA で固定する（新しい版は Dependabot が PR で知らせる）
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: インストーラの作成
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust-toolchain.toml の版の Rust を入れる
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kataribe-installer
          path: target/release/bundle/nsis/*.exe
