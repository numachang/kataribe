name: インストーラ

# LTO 付きのリリースビルドで最も重いので、main へのプッシュのたびには作らない。
# 必要なときに手動で実行するか、v で始まるタグを付けたときに作る
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# トークンは読むだけにする。外部のアクションは、タグを付け替えられても中身が変わらないよう
# コミットの SHA で固定する（新しい版は Dependabot が PR で知らせる）
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: インストーラの作成
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust を入れる
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kataribe-installer
          path: target/release/bundle/nsis/*.exe
