name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust（整形・lint・テスト）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: フロントエンドの成果物の置き場所を用意（Tauri のビルドに必要）
        run: mkdir dist
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # ts feature 付きのテストは src/bindings を書き直すので、差分が出たら Rust の型と生成物がずれている
      - name: TypeScript の型定義（src/bindings）が Rust の型と一致しているか確かめる
        shell: bash
        run: |
          changes=$(git status --porcelain -- src/bindings)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::src/bindings が Rust の型と一致していません。pnpm bindings を実行してコミットしてください。"
            exit 1
          fi

  frontend:
    name: フロントエンド（型検査・lint・テスト）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  bundle:
    name: インストーラの作成
    needs: [rust, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kataribe-installer
          path: target/release/bundle/nsis/*.exe

  e2e:
    name: E2E（本物のアプリを WebView2 で操作）
    needs: [rust, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tauri-driver を入れる
        run: cargo install tauri-driver --locked
      # msedgedriver は、アプリが使う WebView2 ランタイムと同じ版でないと接続できない
      - name: WebView2 と同じ版の msedgedriver を用意する
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client", "HKCU:\Software\$client")
          $version = $keys |
            ForEach-Object { (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ } |
            Select-Object -First 1
          if (-not $version) { throw 'WebView2 ランタイムが見つかりません。' }
          Write-Host "WebView2 $version"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir\edgedriver.zip"
          Expand-Archive "$dir\edgedriver.zip" -DestinationPath $dir -Force
          "KATARIBE_E2E_MSEDGEDRIVER=$dir\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 画面を埋め込んだアプリを作る
        run: pnpm tauri build --debug --no-bundle
      - name: 診断（一時的）WebView2 のリモートデバッグが止められていないか見る
        shell: pwsh
        run: |
          '--- Edge / WebView2 のポリシー'
          foreach ($key in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\WOW6432Node\Policies\Microsoft\Edge') {
            "[$key]"
            Get-ItemProperty -Path $key -ErrorAction SilentlyContinue | Out-String
            Get-ChildItem -Path $key -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          }
          '{}' | Out-File -Encoding utf8 "$env:RUNNER_TEMP\diag-settings.json"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'
          $app = Start-Process target\debug\kataribe.exe -ArgumentList "--settings=$env:RUNNER_TEMP\diag-settings.json" -PassThru
          Start-Sleep -Seconds 15
          '--- WebView2 のプロセスの引数'
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" |
            Select-Object -First 2 -ExpandProperty CommandLine |
            ForEach-Object { $_.Substring(0, [Math]::Min(1500, $_.Length)) }
          try { (Invoke-WebRequest http://127.0.0.1:9333/json/version -UseBasicParsing -TimeoutSec 5).Content } catch { "devtools: $_" }
          Get-Content "$env:LOCALAPPDATA\io.github.numachang.kataribe\EBWebView\DevToolsActivePort" -ErrorAction SilentlyContinue
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
      - run: pnpm e2e
      - name: テスト中に撮った画面を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/artifacts/
          if-no-files-found: ignore
