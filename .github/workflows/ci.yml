name: CI

# 非公開リポジトリの Windows ランナーは実行時間の 2 倍で課金されるので、待ち時間と課金を抑える。
# - 各ジョブは互いを待たずに並列に走らせる
# - インストーラの作成（LTO 付きのリリースビルドで最も重い）は、PR では行わず、main へのプッシュと手動実行のときだけ行う
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust（整形・lint・テスト）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: フロントエンドの成果物の置き場所を用意（Tauri のビルドに必要）
        run: mkdir dist
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # ts feature 付きのテストは src/bindings を書き直すので、差分が出たら Rust の型と生成物がずれている
      - name: TypeScript の型定義（src/bindings）が Rust の型と一致しているか確かめる
        shell: bash
        run: |
          changes=$(git status --porcelain -- src/bindings)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::src/bindings が Rust の型と一致していません。pnpm bindings を実行してコミットしてください。"
            exit 1
          fi

  frontend:
    name: フロントエンド（型検査・lint・テスト）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  bundle:
    name: インストーラの作成
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kataribe-installer
          path: target/release/bundle/nsis/*.exe

  e2e:
    name: E2E（本物のアプリを WebView2 で操作）
    runs-on: windows-latest
    env:
      KATARIBE_E2E_DEBUG_PORT: "9222"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # msedgedriver は、アプリが使う WebView2 ランタイムと同じ版でないと接続できない
      - name: WebView2 と同じ版の msedgedriver を用意する
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client", "HKCU:\Software\$client")
          $version = $keys |
            ForEach-Object { (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ } |
            Select-Object -First 1
          if (-not $version) { throw 'WebView2 ランタイムが見つかりません。' }
          Write-Host "WebView2 $version"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir\edgedriver.zip"
          Expand-Archive "$dir\edgedriver.zip" -DestinationPath $dir -Force
          "KATARIBE_E2E_MSEDGEDRIVER=$dir\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 画面を埋め込んだアプリを作る
        run: pnpm tauri build --debug --no-bundle
      # CI はアプリを管理者として動かすため、WebView2 が環境変数（WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS）を
      # 無視する。代わりにコンピューター単位のポリシーで、E2E が接続するデバッグ用ポートを開かせる
      - name: WebView2 のデバッグ用ポートをポリシーで開く
        shell: pwsh
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name 'kataribe.exe' -Value "--remote-debugging-port=$env:KATARIBE_E2E_DEBUG_PORT" -PropertyType String -Force | Out-Null
      - run: pnpm e2e
      - name: テスト中に撮った画面を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/artifacts/
          if-no-files-found: ignore
