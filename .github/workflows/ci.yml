name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust（整形・lint・テスト）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: フロントエンドの成果物の置き場所を用意（Tauri のビルドに必要）
        run: mkdir dist
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # ts feature 付きのテストは src/bindings を書き直すので、差分が出たら Rust の型と生成物がずれている
      - name: TypeScript の型定義（src/bindings）が Rust の型と一致しているか確かめる
        shell: bash
        run: |
          changes=$(git status --porcelain -- src/bindings)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::src/bindings が Rust の型と一致していません。pnpm bindings を実行してコミットしてください。"
            exit 1
          fi

  frontend:
    name: フロントエンド（型検査・lint・テスト）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  bundle:
    name: インストーラの作成
    needs: [rust, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kataribe-installer
          path: target/release/bundle/nsis/*.exe
